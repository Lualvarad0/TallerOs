<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:232px;height:100%;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px 10px;gap:2px;font-family:Inter,system-ui,sans-serif;color:var(--tx);flex-shrink:0">
  <a href="TallerOS.dc.html" style="display:flex;align-items:center;gap:10px;padding:4px 8px 14px">
    <div style="width:30px;height:30px;border-radius:7px;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;font-size:17px"><i class="ph-bold ph-wrench"></i></div>
    <div style="font-weight:800;font-size:18px;letter-spacing:-.02em">TallerOS</div>
  </a>
  <a href="Login.dc.html" style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:12px;background:var(--sf2)">
    <div style="flex:1;min-width:0"><div style="font-size:11.5px;color:var(--tx3)">Taller Ruta 5</div><div style="font-size:13.5px;font-weight:600">Sucursal Norte</div></div>
    <i class="ph ph-caret-up-down" style="color:var(--tx3)"></i>
  </a>
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="11">
    <sc-if value="{{ it.sep }}"><div style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);padding:14px 10px 4px">{{ it.label }}</div></sc-if>
    <sc-if value="{{ it.on }}"><a href="{{ it.href }}" style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:7px;background:var(--sf3);font-size:15px;font-weight:600;color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)"><i class="ph-bold {{ it.icon }}" style="font-size:18px"></i><span style="flex:1">{{ it.label }}</span><span style="font-family:'JetBrains Mono';font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--tx3)">{{ it.n }}</span></a></sc-if>
    <sc-if value="{{ it.off }}"><a href="{{ it.href }}" style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:7px;font-size:15px;font-weight:500;color:var(--tx2)" style-hover="background:var(--sf2);color:var(--tx)"><i class="ph {{ it.icon }}" style="font-size:18px"></i><span style="flex:1">{{ it.label }}</span><span style="font-family:'JetBrains Mono';font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--tx3)">{{ it.n }}</span></a></sc-if>
  </sc-for>
  <div style="flex:1"></div>
  <div style="display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--bd)">
    <div style="width:32px;height:32px;border-radius:50%;background:var(--vio-s);color:var(--vio);display:grid;place-items:center;font-size:12px;font-weight:700">PG</div>
    <div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:600">Patricia Gómez</div><div style="font-size:12px;color:var(--tx3)">Jefa de taller</div></div>
    <i class="ph ph-gear-six" style="color:var(--tx3);font-size:18px"></i>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;tablero&quot;,&quot;recepcion&quot;,&quot;delegado&quot;,&quot;mecanico&quot;,&quot;vehiculos&quot;,&quot;clientes&quot;,&quot;cotizaciones&quot;,&quot;notificaciones&quot;,&quot;reportes&quot;,&quot;config&quot;],&quot;default&quot;:&quot;tablero&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'tablero';
    const raw = [
      ['dashboard','Dashboard','ph-squares-four','Dashboard.dc.html',''],
      ['tablero','Tablero OT','ph-kanban','Tablero-Kanban.dc.html','24'],
      ['recepcion','Recepción','ph-clipboard-text','Recepcion.dc.html',''],
      ['delegado','Registro delegado','ph-users-three','Registro-Delegado.dc.html','3'],
      ['mecanico','Modo taller (PIN)','ph-device-tablet','Vista-Mecanico.dc.html',''],
      ['-','Clientes y vehículos'],
      ['vehiculos','Vehículos','ph-car-profile','Ficha-Vehiculo.dc.html',''],
      ['clientes','Clientes','ph-address-book','Ficha-Cliente.dc.html',''],
      ['cotizaciones','Cotizaciones','ph-receipt','Cotizacion.dc.html','5'],
      ['notificaciones','Notificaciones','ph-whatsapp-logo','Notificaciones.dc.html',''],
      ['-','Gestión'],
      ['reportes','Reportes','ph-chart-bar','Reportes.dc.html',''],
      ['config','Configuración','ph-sliders-horizontal','Configuracion.dc.html','']
    ];
    return { items: raw.map(r => r[0] === '-' ? { sep: true, label: r[1] } : { on: r[0] === a, off: r[0] !== a, label: r[1], icon: r[2], href: r[3], n: r[4] }) };
  }
}
</script>
</body>
</html>
