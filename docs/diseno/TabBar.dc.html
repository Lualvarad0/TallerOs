<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:84px;background:var(--sf);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px 26px;font-family:Inter,system-ui,sans-serif;flex-shrink:0">
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
    <sc-if value="{{ it.fab }}"><a href="{{ it.href }}" style="display:grid;place-items:center"><div style="width:50px;height:50px;border-radius:14px;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;font-size:26px"><i class="ph-bold ph-plus"></i></div></a></sc-if>
    <sc-if value="{{ it.on }}"><a href="{{ it.href }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx);font-size:11px;font-weight:700"><i class="ph-fill {{ it.icon }}" style="font-size:24px"></i>{{ it.label }}</a></sc-if>
    <sc-if value="{{ it.off }}"><a href="{{ it.href }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx3);font-size:11px;font-weight:500"><i class="ph {{ it.icon }}" style="font-size:24px"></i>{{ it.label }}</a></sc-if>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:84},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;tablero&quot;,&quot;vehiculos&quot;,&quot;mas&quot;],&quot;default&quot;:&quot;tablero&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'tablero';
    const raw = [['dashboard','Inicio','ph-house','Dashboard.dc.html'],['tablero','Tablero','ph-kanban','Tablero-Kanban.dc.html'],['fab','','','Recepcion.dc.html'],['vehiculos','Vehículos','ph-car-profile','Ficha-Vehiculo.dc.html'],['mas','Más','ph-dots-three-outline','TallerOS.dc.html']];
    return { items: raw.map(r => r[0] === 'fab' ? { fab: true, href: r[3] } : { on: r[0] === a, off: r[0] !== a, label: r[1], icon: r[2], href: r[3] }) };
  }
}
</script>
</body>
</html>
